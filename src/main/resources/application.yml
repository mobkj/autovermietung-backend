# Datenbank
spring:
  datasource:
    url: jdbc:h2:mem:autovermietungdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

mailgun:
  api-key: ${MAILGUN_API_KEY}
  domain: ${MAILGUN_DOMAIN:mazari-autovermietung.com}
  base-url: ${MAILGUN_BASE_URL:https://api.eu.mailgun.net}


server:
  port: ${PORT:8080}

# Für die Anwendung (JWT & E-Mails)
app:
  jwt:
    secret: ${APP_SECRET} # 32+ Zeichen Base64
    expiration-ms: 86400000 # 24 Stunden
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

  email:
    from: "Mazari Autovermietung <no-reply@mazari-autovermietung.com>"

# Zahlung mit Stripe
stripe:
  secret-key: ${SK_TEST}
  public-key: ${PK_TEST}
  webhookSecret: ${WEBHOOK_SECRET}

