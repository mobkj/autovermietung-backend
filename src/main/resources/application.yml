spring:
  datasource:
    url: jdbc:h2:mem:autovermietungdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

app:
  jwt:
    secret: "eW91YXJlZ29atnRlZHN1cGVyZ2VoZWltZXNLZXkxMjM0NTY3ODk=" # 32+ Zeichen Base64
    expiration-ms: 86400000 # 24 Stunden